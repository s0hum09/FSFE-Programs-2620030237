<html>
    <head>
        <title>
            Employee Registration
        </title>
    </head>
    <body align = "left" bgcolor = "bisque"></body>
    <h1> Employee Registration Form </h1>
    <form>
        Employee Name : <input type = "text" name = "a1" placeholder = "Enter your name"><br><br>
        Password : <input type = "password" name = "a2" required><br><br>
        Email : <input type = "email" name = "a3"><br><br>
        Mobile Number : <input type = "tel" name = "a4" ><br><br>
        Age : <input type = "number" name = "a5"><br><br>
        Date of Birth : <input type = "date" name = "a6"><br><br>
        Preferred Interview Time : <input type = "time" name = "a7"><br><br>
        Gender : <input type = "radio"  name = "a8" required>Male
<input type = "radio"  name = "a8" required>Female<br><br>

        Skills : <input type = "checkbox" name = "g9">HTML
        <input type  = "checkbox" name = "a9">CSS
        <input type = "checkbox" name = "a9">Java Script<br><br>

        Select Department : <select name = "a10" required>
                <option value = "1">Select Department</option>
                <option>B.Tech</option>
                <option>M.Tech</option>
                <option>P.hD</option>
                </select><br><br>
                Uplaod Resume : <input type = "file" name = "pic" accept = "pdf"><br><br>
            Address : <textarea name = "a11" required rows = "3" cols = "30" placeholder = "Enter your Address"></textarea><br><br>
            Work Experience : <input type = "range" id = "exp" min = "0" max = "100" value = "50" steps = "5"><br><br>
            LinkedIN Profile : <input type = "url" name = "a11" placeholder = "Enter LinkedIN Url"><br><br>
            <button type = "Register">Register</button>
            <button type = "Reset">Clear</button>
    </form> 

    </body>

</html>
