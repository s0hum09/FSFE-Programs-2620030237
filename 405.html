<html>
    <head>
        <title>
            Registration PAGE
        </title>
    </head>
    <body align = "center" method = "get">
        <body style="background-color: beige;"></body>
        <h1> REGISTRATION PAGE </h1>
        <form action = "Success.html">
            Name : <input type = "text" name ="g1" placeholder="Enter Name....." autofocus><br><br>
            Email : <input type = "email" name ="g2" placeholder="xyz@gmail.com" required><br><br>
            Mobile : <input type = "tel" name ="g3" placeholder="Enter Mobile Number" pattern="[0-9]{10}" required>
            <br><br>
            Course : <select name = "g4" required>
                <option value = "1">SELECT</option>
                <option>B.Tech</option>
                <option>M.Tech</option>
                <option>P.hD</option> 
                </select><br><br>

            Gender : <input type="radio" name = "g5">Male
            <input type="radio" name = "g5">Female
            <input type = "radio" name = "g5">Non-Binary
            <br><br>
            Address : <textarea name ="g6" required rows = "3" cols="67" placeholder="Address?">
            </textarea><br>
    <br><br>
            Skills Known : <input type = 'checkbox' name = "g7">HTML
            <input type = "checkbox" name  = "g7">CSS
            <input type = "checkbox" name  = "g7">JavaScript
            <input type="checkbox" name = "g7">PHP<br><br>

            Inter Percentage : <input type = "number" name = "g8" min = "0" max = "100" required><br><br>
            Upload Photo : <input type="file" name = "g9" accept ="jpg.png.jpeg"><br><br>
            Password : <input type ="password" name = "g10" minlength="6" required><br><br>
            <input type="checkbox" name = "g11" required> I agree to the terms.<br><br>
            <button type = "submit">Register</button>
            <button type = "reset">Clear All</button>
        </form>
    </body>
</html>
