<html>
    <head>
        <style>
            .container{
                grid:1fr 1fr 1fr;
                gap:10px;
                border:2px solid black;
                padding:10px;
            }
            .box{
                background: lightgreen;
                padding:20px;
                text-align: center;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <h1>CSS Grid Demo</h1>
        <div class = "container">
        <div class = "box">1</div>
        <div class = "box">2</div>
        <div class = "box">3</div>
        <div class = "box">4</div>
    </body>
</html>
